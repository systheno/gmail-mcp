[project]
name = "gmail-mcp-gateway"
version = "1.0.0"
description = "Security-focused MCP gateway for read/organize/draft access to multiple Gmail accounts. Cannot send, trash, or delete mail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.10",
    "cryptography>=42.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
gmail-mcp-gateway = "gmail_mcp_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:gmail_mcp_gateway.*"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
